# Root logger
rootLogger.level = DEBUG
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = stdout
rootLogger.appenderRef.stdout.level = INFO
rootLogger.appenderRef.file.ref = file

# Properties
property.fileName = hippodrome
property.logDir = logs
property.logFile = ${logDir}/${fileName}.log
property.rollingDir = ${logDir}/archive
property.rollingFile = ${rollingDir}/${fileName}-%d{yyyy-MM-dd}.log
property.logPattern = [%level] %d{yyyy-MM-dd HH:mm:ss.SSS} %c{1}: %msg%n

# Console appender
appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = ${logPattern}

# Rolling file appender
appender.file.type = RollingFile
appender.file.name = file
appender.file.fileName = ${logFile}
appender.file.filePattern = ${rollingFile}
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${logPattern}
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
# delete old logs after 7 days
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.action.type = Delete
appender.file.strategy.action.basePath = ${rollingDir}
appender.file.strategy.action.condition.type = IfFileName
appender.file.strategy.action.condition.glob = ${fileName}-*.log
appender.file.strategy.action.condition.nestedCondition.type = IfLastModified
appender.file.strategy.action.condition.nestedCondition.age = 7d
